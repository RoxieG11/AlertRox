name: Build AlertRox Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/upload-keystore.jks
            cat <<EOF > app/android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "No KEYSTORE_BASE64 secret provided; falling back to debug signing."
          fi

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build APK (Release & Obfuscated)
        working-directory: ./app
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Prepare APK file
        run: cp app/build/app/outputs/flutter-apk/app-release.apk AlertRox.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlertRox-Android-APK
          path: AlertRox.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AlertRox ${{ github.ref_name }} (Android Release)
          draft: false
          prerelease: false
          files: AlertRox.apk
          body: |
            ### 🚨 AlertRox ${{ github.ref_name }} — Android APK Yayınlandı!
            
            Bu sürüm ile eklenen başlıca özellikler:
            - 🛡️ **Güvenlik & RLS Mimarisi:** Hardcoded anahtarlar kaldırıldı, Row-Level Security ve şifrelenmiş depolama (EncryptedSharedPreferences) eklendi.
            - 🔐 **APK Obfuscation & Keystore İmzalama:** Kod karartma ve üretim anahtarı desteği.
            - 🔔 **Arka Plan Gözcü Servisi (Foreground Service):** Android'in uygulamayı uyutmasını engeller ve PC açılışlarını anında ses/titreşim ile bildirir.
            - 🪟 **Saydam Mod (Glassmorphism):** iOS tarzı yarı saydam buzlu cam kart ve buton estetiği.
            - 🎨 **Tema Özelleştirici & Canlı RGB Seçici:** 7 hazır renk paleti ve RGB slider'ları ile canlı renk seçimi.
            - ⏱️ **24 Saatlik Kapatma Sayacı:** 10 saniyeden 24 saate kadar uzatılabilir sayaç ve 12 hazır çip.
            - 🔒 **PC Kapatma İptal Kilidi:** PC başındaki kişinin kapatmayı iptal etmesini engelleme (Ayarlardan opsiyonel).
            - 🌓 **Widget Tema Seçimi:** Widget'ı Aydınlık veya Karanlık mod olarak belirleyebilme.
            - 👨‍💻 **Roxie GitHub Bağlantısı:** Ayarlar kısmından tek dokunuşla geliştirici profiline erişim.
            - 💡 **Açık Kaynak & Tamamen Ücretsiz**
            
            - 👨‍💻 **Geliştirici:** Roxie
            
            #### 📲 Nasıl Kurulur?
            Aşağıdaki `AlertRox.apk` dosyasını telefonunuza doğrudan indirin ve açarak yükleyin.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

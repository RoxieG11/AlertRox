name: Build AlertRox Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/upload-keystore.jks
            cat <<EOF > app/android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "No KEYSTORE_BASE64 secret provided; falling back to debug signing."
          fi

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Validate i18n & Run Unit Tests
        working-directory: ./app
        run: |
          dart run scripts/check_i18n.dart
          flutter test

      - name: Build APK (Release & Obfuscated)
        working-directory: ./app
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Prepare APK file
        run: cp app/build/app/outputs/flutter-apk/app-release.apk AlertRox.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlertRox-Android-APK
          path: AlertRox.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AlertRox ${{ github.ref_name }} (Android Release)
          draft: false
          prerelease: false
          files: AlertRox.apk
          body: |
            ### 🚨 AlertRox ${{ github.ref_name }} — Android Final Release

            Bu sürüm ile eklenen başlıca özellikler:
            - 📱 **Akıllı Giriş & Panodan Doldur:** .env formatını otomatik algılayan tek tıkla yapıştırma, ön ek temizleme ve kesintisiz oturum başlatma.
            - 🖼️ **Uygulama İçi Medya Oynatıcı & Önizleme:** İndirme zorunluluğu olmadan fotoğrafları tam ekran inceleme (zoom/pan) ve 10 saniyelik ses kayıtlarını doğrudan uygulama içinde dinleme.
            - ⚡ **Işık Hızında Tepki (Sub-500ms):** Ses denetimi ve uygulama başlatma/kapatma komutlarında anlık yoklama ve durum itme.
            - 📦 **Kararlı Uygulama Yöneticisi:** Tarayıcı sekme motorları ve dil sunucuları filtrelendi; Java (TLauncher) yanlış tespitleri giderildi.
            - 🔋 **Özelleştirilebilir Bildirim Tercihleri:** Açılış, Laptop Prizden Çekildi, Düşük Pil (%20) ve Kapanış bildirimlerini tek tek açıp kapatabilme.
            - 📱 **Xiaomi / HyperOS Widget Düzeltmesi:** Yuvarlak köşe bozulması giderildi, canlı çevrimiçi/çevrimdışı durum renkleri sabitlendi.
            - 🌐 **10 Dil Eksiksiz:** 220 anahtar, %100 tam çeviri ve RTL desteği.
            - 🛡️ **Sıfır Toleranslı Güvenlik:** PostgreSQL RLS, EncryptedSharedPreferences ve parametrik güvenli süreç yönetimi.
            - 💡 **Açık Kaynak & Tamamen Ücretsiz**
            
            - 👨‍💻 **Geliştirici:** Roxie (@RoxieG11)
            
            #### 📲 Nasıl Kurulur?
            Aşağıdaki `AlertRox.apk` dosyasını telefonunuza doğrudan indirin ve açarak yükleyin.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
